apiVersion: v1
kind: Pod
metadata:
  name: test-deny-metadata
  namespace: challenges
  labels:
    team: "999"
    challenge: test-deny-metadata
    managed-by: ctf-controller
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: curl
    image: curlimages/curl:8.6.0
    command: ["curl", "--max-time", "5", "-s", "http://169.254.169.254/metadata/v1"]
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  restartPolicy: Never
