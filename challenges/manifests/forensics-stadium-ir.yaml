id: stadium-ir
name: "Stadium IR"
category: Forensics
description: "Incident response challenge. Investigate a compromised stadium system, find persistence and payload."
initial: 800
minimum: 120
decay: 15
image: registry.digitalocean.com/infodays-registry/challenges:stadium-ir
port: 2222          # external NodePort service port (players connect here)
container_port: 22  # sshd listens on 22 inside the container
type: tcp
run_as_root: true   # sshd + artifact planting in /etc/cron.d require root
memory_limit: "256Mi"
flags:
  - id: stadium-ir-1
    name: "Stadium IR — Persistence"
    category: Forensics
    env: FLAG1
    initial: 300
    minimum: 45
    decay: 15
  - id: stadium-ir-2
    name: "Stadium IR — Payload"
    category: Forensics
    env: FLAG2
    initial: 500
    minimum: 75
    decay: 10
