id: referee-briefing
name: "Referee Briefing"
category: Misc
description: "A TCP service hosting a referee briefing session. Two flags await — find the first, then escalate."
initial: 700
minimum: 100
decay: 20
image: registry.digitalocean.com/infodays-registry/challenges:referee-briefing
port: 4444
type: tcp
run_as_root: true                  # plants flags in /root/, uses runuser to drop to referee
allow_privilege_escalation: true   # SUID find (GTFOBins privesc) requires NoNewPrivs=0
flags:
  - id: referee-briefing-1
    name: "Referee Briefing — Part 1"
    category: Misc
    env: USER_FLAG
    initial: 250
    minimum: 35
    decay: 20
  - id: referee-briefing-2
    name: "Referee Briefing — Part 2"
    category: Misc
    env: ROOT_FLAG
    initial: 450
    minimum: 65
    decay: 15
