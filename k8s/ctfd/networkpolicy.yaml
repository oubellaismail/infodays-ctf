---
# Supplementary egress rules to fill gaps left by Phase 1 Terraform
# These policies allow CTFd to reach its dependencies after Phase 1's default-deny-all
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-controller-egress-k8s-api
  namespace: ctfd
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [controller-api, controller-daemon]
  egress:
  - to:
    - ipBlock:
        cidr: 10.114.32.1/32
    - ipBlock:
        cidr: 100.65.0.227/32
    ports:
    - protocol: TCP
      port: 443
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-egress-controller
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: ctfd
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: controller-api
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 5000
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-to-controller-ingress
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: controller-api
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ctfd
    ports:
    - protocol: TCP
      port: 5000
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-egress-dns
  namespace: ctfd
spec:
  podSelector: {}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-egress-proxysql
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: ctfd
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: proxysql
    ports:
    - protocol: TCP
      port: 6033
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxysql-ingress-ctfd
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: proxysql
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ctfd
    ports:
    - protocol: TCP
      port: 6033
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxysql-egress-mysql
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: proxysql
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: mysql
    ports:
    - protocol: TCP
      port: 3306
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxysql-egress-dns
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: proxysql
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-egress-redis
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: ctfd
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  policyTypes:
  - Egress
---
# Allow ProxySQL ingress to MySQL (Terraform only allows ctfd->mysql ingress)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxysql-ingress-mysql
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: mysql
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: proxysql
    ports:
    - port: 3306
      protocol: TCP
  policyTypes:
  - Ingress
