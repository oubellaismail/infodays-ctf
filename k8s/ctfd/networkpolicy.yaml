---
# Supplementary egress rules to fill gaps left by Phase 1 Terraform
# These policies allow CTFd to reach its dependencies after Phase 1's default-deny-all
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-egress-dns
  namespace: ctfd
spec:
  podSelector: {}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-egress-mysql
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: ctfd
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: mysql
    ports:
    - protocol: TCP
      port: 3306
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-egress-redis
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: ctfd
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  policyTypes:
  - Egress
