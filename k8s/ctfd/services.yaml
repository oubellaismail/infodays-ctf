---
apiVersion: v1
kind: Service
metadata:
  name: ctfd-service
  namespace: ctfd
spec:
  type: ClusterIP
  selector:
    app: ctfd
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ctfd
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ctfd
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
