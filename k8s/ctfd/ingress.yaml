apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ctfd-ingress
  namespace: ctfd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/app-root: /challenges
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ctfd.infodays.net
    secretName: ctfd-tls-secret
  rules:
  - host: ctfd.infodays.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ctfd-service
            port:
              number: 80
