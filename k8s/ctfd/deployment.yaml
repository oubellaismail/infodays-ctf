apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctfd
  namespace: ctfd
spec:
  replicas: 5
  selector:
    matchLabels:
      app: ctfd
  template:
    metadata:
      labels:
        app: ctfd
    spec:
      initContainers:
      - name: wait-for-proxysql
        image: busybox
        command:
        - sh
        - -c
        - until nc -z proxysql 6033; do echo waiting for proxysql; sleep 2; done
      containers:
      - name: ctfd
        image: ctfd/ctfd:latest
        env:
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ctfd-secrets
              key: MYSQL_PASSWORD
        - name: DATABASE_URL
          value: mysql+pymysql://ctfd:$(MYSQL_PASSWORD)@proxysql:6033/ctfd
        - name: REDIS_URL
          value: redis://redis:6379
        - name: CACHE_TYPE
          value: redis
        - name: CACHE_REDIS_URL
          value: redis://redis:6379
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ctfd-secrets
              key: SECRET_KEY
        - name: CTF_MASTER_SECRET
          valueFrom:
            secretKeyRef:
              name: ctfd-secrets
              key: CTF_MASTER_SECRET
        - name: SERVER_SENT_EVENTS
          value: "false"
        - name: WORKERS
          value: "4"
        - name: REVERSE_PROXY
          value: "true"
        - name: HTTP_RELATIVE_PATH
          value: "/"
        - name: SESSION_COOKIE_DOMAIN
          value: ".infodays.net"
        - name: SESSION_COOKIE_SECURE
          value: "true"
        - name: SESSION_COOKIE_HTTPONLY
          value: "true"
        - name: MAIL_SERVER
          value: ""
        - name: MAIL_PORT
          value: ""
        - name: MAIL_USERNAME
          value: ""
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ctfd-secrets
              key: MAIL_PASSWORD
        - name: MAILFROM_ADDR
          value: ""
        ports:
        - containerPort: 8000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 1000m
            memory: 1536Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        volumeMounts:
        - name: plugin-init
          mountPath: /opt/CTFd/CTFd/plugins/controller-plugin/__init__.py
          subPath: __init__.py
          readOnly: true
        - name: plugin-js
          mountPath: /opt/CTFd/CTFd/plugins/controller-plugin/assets/plugin.js
          subPath: plugin.js
          readOnly: true
        - name: plugin-css
          mountPath: /opt/CTFd/CTFd/plugins/controller-plugin/assets/style.css
          subPath: style.css
          readOnly: true
        - name: plugin-logo-dark
          mountPath: /opt/CTFd/CTFd/plugins/controller-plugin/assets/logo-dark.png
          subPath: logo-dark.png
          readOnly: true
        - name: plugin-logo-light
          mountPath: /opt/CTFd/CTFd/plugins/controller-plugin/assets/logo-light.png
          subPath: logo-light.png
          readOnly: true
      volumes:
      - name: plugin-init
        configMap:
          name: ctfd-plugin-init
      - name: plugin-js
        configMap:
          name: ctfd-plugin-js
      - name: plugin-css
        configMap:
          name: ctfd-plugin-css
      - name: plugin-logo-dark
        configMap:
          name: ctfd-plugin-logo-dark
      - name: plugin-logo-light
        configMap:
          name: ctfd-plugin-logo-light
