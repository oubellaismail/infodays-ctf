apiVersion: v1
kind: ServiceAccount
metadata:
  name: ctf-controller
  namespace: ctfd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctf-controller
  namespace: challenges
rules:
  # Deployments: create (bulk_spawn), get/list/patch (api + daemon)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Services: create (bulk_spawn)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Secrets: create (bulk_spawn)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Ingresses: create (bulk_spawn) — delete removed; teardown uses admin kubeconfig
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctf-controller
  namespace: challenges
subjects:
  - kind: ServiceAccount
    name: ctf-controller
    namespace: ctfd
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ctf-controller
---
# Separate role for ingress-nginx namespace (TCP ConfigMap)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctf-controller-nginx
  namespace: ingress-nginx
rules:
  # ConfigMap: get/patch (bulk_spawn reads+patches tcp-services, api reads)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctf-controller-nginx
  namespace: ingress-nginx
subjects:
  - kind: ServiceAccount
    name: ctf-controller
    namespace: ctfd
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ctf-controller-nginx
