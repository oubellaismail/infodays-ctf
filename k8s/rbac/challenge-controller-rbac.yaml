apiVersion: v1
kind: ServiceAccount
metadata:
  name: ctf-controller
  namespace: ctfd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ctf-provisioner
  namespace: ctfd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctf-controller
  namespace: challenges
rules:
  # Runtime controller API: count, inspect, and scale pre-created deployments.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  # Runtime controller API: read NodePort assignments for challenge URLs.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctf-provisioner
  namespace: challenges
rules:
  # Provisioning only: bulk_spawn creates/updates challenge resources.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctf-controller
  namespace: challenges
subjects:
  - kind: ServiceAccount
    name: ctf-controller
    namespace: ctfd
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ctf-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctf-provisioner
  namespace: challenges
subjects:
  - kind: ServiceAccount
    name: ctf-provisioner
    namespace: ctfd
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ctf-provisioner
---
# Separate role for ingress-nginx namespace (TCP ConfigMap)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctf-controller-nginx
  namespace: ingress-nginx
rules:
  # Provisioning only: bulk_spawn reads+patches tcp-services.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctf-controller-nginx
  namespace: ingress-nginx
subjects:
  - kind: ServiceAccount
    name: ctf-provisioner
    namespace: ctfd
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ctf-controller-nginx
