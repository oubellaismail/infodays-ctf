apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-challenges-egress-dns
  namespace: challenges
spec:
  podSelector: {}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  policyTypes:
  - Egress
