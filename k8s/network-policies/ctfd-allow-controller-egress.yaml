apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-controller-egress-k8s-api
  namespace: ctfd
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [controller-api, controller-daemon, controller-provisioner]
  egress:
  - to:
    - ipBlock:
        cidr: 10.114.32.1/32
    - ipBlock:
        cidr: 100.65.0.227/32
    ports:
    - protocol: TCP
      port: 443
  policyTypes:
  - Egress
