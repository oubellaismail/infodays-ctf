apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-controller-egress-k8s-api
  namespace: ctfd
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [controller-api, controller-daemon]
  egress:
  - to:
    - ipBlock:
        cidr: 10.114.32.1/32
    ports:
    - protocol: TCP
      port: 443
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-egress-internet
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: controller-api
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
  policyTypes:
  - Egress
