apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-ctfd
  namespace: ctfd
spec:
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-egress-dns
  namespace: ctfd
spec:
  podSelector: {}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-egress-mysql
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: ctfd
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: mysql
    ports:
    - protocol: TCP
      port: 3306
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-egress-redis
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: ctfd
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-egress-controller
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: ctfd
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: controller-api
    ports:
    - protocol: TCP
      port: 5000
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctfd-to-controller-ingress
  namespace: ctfd
spec:
  podSelector:
    matchLabels:
      app: controller-api
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ctfd
    ports:
    - protocol: TCP
      port: 5000
  policyTypes:
  - Ingress
