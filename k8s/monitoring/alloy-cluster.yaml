apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-cluster
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-cluster
rules:
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-cluster
subjects:
- kind: ServiceAccount
  name: alloy-cluster
  namespace: monitoring

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-cluster-config
  namespace: monitoring
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }

    loki.source.kubernetes_events "cluster_events" {
      job_name   = "kubernetes/events"
      log_format = "logfmt"
      forward_to = [loki.process.cluster_events.receiver]
    }

    loki.process "cluster_events" {
      stage.static_labels {
        values = {
          cluster = "infodays-ctf",
        }
      }

      stage.labels {
        values = {
          job = "kubernetes/events",
        }
      }

      forward_to = [loki.write.default.receiver]
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy-cluster
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy-cluster
  template:
    metadata:
      labels:
        app: alloy-cluster
    spec:
      serviceAccountName: alloy-cluster
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alloy
        image: grafana/alloy@sha256:1f40cf52adda8fab3e058f9347a5d165624ecb9fbc1527769cb744748961940d
        args:
        - run
        - --server.http.listen-addr=0.0.0.0:12345
        - --storage.path=/var/lib/alloy/data
        - /etc/alloy/config.alloy
        ports:
        - containerPort: 12345
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 12345
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 12345
          initialDelaySeconds: 30
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
          readOnly: true
        - name: data
          mountPath: /var/lib/alloy/data
      volumes:
      - name: config
        configMap:
          name: alloy-cluster-config
      - name: data
        emptyDir: {}
