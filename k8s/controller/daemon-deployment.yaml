apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-daemon
  namespace: ctfd
  labels:
    app: controller-daemon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controller-daemon
  template:
    metadata:
      labels:
        app: controller-daemon
    spec:
      serviceAccountName: ctf-daemon
      imagePullSecrets:
      - name: docr-pull-secret
      containers:
      - name: controller-daemon
        image: registry.digitalocean.com/infodays-registry/base:controller-daemon
        imagePullPolicy: IfNotPresent
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: "9f99eeed-db17-4c09-9bdf-ccb948b362c2.k8s.ondigitalocean.com"
        - name: KUBERNETES_SERVICE_PORT
          value: "443"
        - name: CTF_MASTER_SECRET
          valueFrom:
            secretKeyRef:
              name: ctfd-secrets
              key: CTF_MASTER_SECRET
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
