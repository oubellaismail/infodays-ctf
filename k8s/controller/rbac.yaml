# DEPRECATED: Superseded by k8s/rbac/challenge-controller-rbac.yaml — do not apply this file after Phase 5
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ctf-controller
  namespace: ctfd

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctf-controller
  namespace: challenges
rules:
  # Deployments: create (bulk_spawn), get/list/patch (api + daemon)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch"]
  # Secrets: create (bulk_spawn)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Services: create (bulk_spawn)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create"]
  # Ingresses: create (bulk_spawn)
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctf-controller
  namespace: challenges
subjects:
  - kind: ServiceAccount
    name: ctf-controller
    namespace: ctfd
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ctf-controller

---
# Separate role for ingress-nginx namespace (TCP ConfigMap)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctf-controller-nginx
  namespace: ingress-nginx
rules:
  # ConfigMap: get/patch (bulk_spawn reads+patches tcp-services, api reads)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctf-controller-nginx
  namespace: ingress-nginx
subjects:
  - kind: ServiceAccount
    name: ctf-controller
    namespace: ctfd
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ctf-controller-nginx
