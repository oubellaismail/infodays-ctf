# DEPRECATED: Superseded by k8s/rbac/challenge-controller-rbac.yaml.
# Kept as a safety mirror so applying this old path does not restore broad
# runtime controller permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ctf-controller
  namespace: ctfd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ctf-provisioner
  namespace: ctfd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctf-controller
  namespace: challenges
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctf-provisioner
  namespace: challenges
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctf-controller
  namespace: challenges
subjects:
  - kind: ServiceAccount
    name: ctf-controller
    namespace: ctfd
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ctf-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctf-provisioner
  namespace: challenges
subjects:
  - kind: ServiceAccount
    name: ctf-provisioner
    namespace: ctfd
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ctf-provisioner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctf-controller-nginx
  namespace: ingress-nginx
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctf-controller-nginx
  namespace: ingress-nginx
subjects:
  - kind: ServiceAccount
    name: ctf-provisioner
    namespace: ctfd
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ctf-controller-nginx
